name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон, но только на PR:
  # прогон на main доходит до выкладки, обрывать его на середине нельзя.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Бэкенд — ruff + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://todo:todo@127.0.0.1:55433/todo
      REDIS_URL: redis://127.0.0.1:56379/0
      COOKIE_SECURE: 'false'
      SECRET_KEY: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: Линтер
        run: uv run ruff check app tests

      - name: Формат
        run: uv run ruff format --check app tests

      - name: Миграции применяются на чистой базе
        run: uv run alembic upgrade head

      - name: Тесты
        run: uv run pytest -q

  contract:
    name: Контракт — openapi.json и типы не отстали от кода
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --all-extras --dev

      - run: npm ci
        working-directory: frontend

      # Сначала контракт выгружается из текущего кода бэкенда, потом из него
      # генерируются типы. Сравнение двух checked-in файлов между собой
      # пропустило бы случай, когда устарели оба сразу.
      - name: Выгрузка OpenAPI из кода бэкенда
        run: uv run python -m app.cli export-openapi

      - name: Генерация типов из OpenAPI
        working-directory: frontend
        run: npm run gen:api

      - name: Файлы в репозитории совпадают с выгрузкой
        run: |
          git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts || {
            echo "::error::Контракт устарел — выполните 'uv run python -m app.cli export-openapi' и 'npm run gen:api' в frontend"
            exit 1
          }

  frontend:
    name: Фронтенд — eslint + vitest + сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Формат
        run: npm run format:check

      - name: Юнит-тесты
        run: npm run test

      - name: Сборка
        run: npm run build

  image:
    name: Образ API собирается
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Сборка без публикации: ошибка Dockerfile должна падать на проверке,
      # а не на выкладке. Кэш общий с публикующей задачей ниже.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    needs: [backend, frontend, contract]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://todo:todo@127.0.0.1:55433/todo
      REDIS_URL: redis://127.0.0.1:56379/0
      COOKIE_SECURE: 'false'
      SECRET_KEY: ci-only-secret
      # Только в CI: e2e не может «подсмотреть» код подтверждения иначе.
      ENABLE_TESTING_ENDPOINTS: 'true'
      # Весь сценарий идёт с одного адреса, обычный лимит на IP его отсечёт.
      OTP_REQUEST_LIMIT: '500'
      LOGIN_RATE_LIMIT: '500'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --all-extras --dev
      - run: uv run alembic upgrade head
      - run: uv run python -m app.cli seed-attributes

      - name: Запуск бэкенда
        run: |
          uv run uvicorn app.main:app --port 8000 --log-level warning &
          npx --yes wait-on http://127.0.0.1:8000/healthz --timeout 60000

      - name: Установка фронтенда
        working-directory: frontend
        run: npm ci

      - name: Браузер для Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Запуск SPA
        working-directory: frontend
        run: |
          npm run dev &
          npx --yes wait-on http://localhost:5173 --timeout 60000

      - name: Сквозной сценарий
        working-directory: frontend
        # В CI браузер ставит сам Playwright, поэтому системный путь не нужен.
        env:
          CHROMIUM_PATH: ''
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # --- Выкладка ---------------------------------------------------------
  # Выпуск живёт в одном workflow с проверками: отдельный deploy.yml стартовал
  # по тому же push независимо от CI и выкладывал непроверенный код.

  deploy-spa:
    name: SPA → Vercel
    runs-on: ubuntu-latest
    needs: [backend, frontend, contract, image, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    # Один деплой за раз: параллельные выкладки перетирали бы друг друга.
    concurrency:
      group: deploy-spa-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Не задан секрет VERCEL_TOKEN — выкладка пропущена"
            exit 1
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-api:
    name: API → образ контейнера
    runs-on: ubuntu-latest
    needs: [backend, frontend, contract, image, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-api-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR принимает только нижний регистр, а владелец репозитория написан
      # с заглавной буквы: github.repository как есть даёт отказ реестра.
      - name: Имя образа
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      # Бэкенд с SSE и подписчиком Redis не работает в serverless, поэтому
      # публикуется образ для контейнерного хостинга, а не функция Vercel.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что дальше
        run: |
          echo "Образ опубликован. Разверните его на контейнерном хостинге и"
          echo "выполните миграции: alembic upgrade head."
          echo "Отдельным процессом запустите воркер: python -m app.worker."
