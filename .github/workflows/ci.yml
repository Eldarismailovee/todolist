name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — ruff + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://todo:todo@127.0.0.1:55433/todo
      REDIS_URL: redis://127.0.0.1:56379/0
      COOKIE_SECURE: 'false'
      SECRET_KEY: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: Линтер
        run: uv run ruff check app tests

      - name: Формат
        run: uv run ruff format --check app tests

      - name: Миграции применяются на чистой базе
        run: uv run alembic upgrade head

      - name: Тесты
        run: uv run pytest -q

  frontend:
    name: Фронтенд — eslint + vitest + сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Типы совпадают с OpenAPI бэкенда
        run: |
          npx openapi-typescript ../openapi.json -o /tmp/schema.d.ts
          diff -u src/api/schema.d.ts /tmp/schema.d.ts \
            || (echo "::error::src/api/schema.d.ts устарел — выполните npm run gen:api"; exit 1)

      - name: Линтер
        run: npm run lint

      - name: Формат
        run: npm run format:check

      - name: Юнит-тесты
        run: npm run test

      - name: Сборка
        run: npm run build

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://todo:todo@127.0.0.1:55433/todo
      REDIS_URL: redis://127.0.0.1:56379/0
      COOKIE_SECURE: 'false'
      SECRET_KEY: ci-only-secret
      # Только в CI: e2e не может «подсмотреть» код подтверждения иначе.
      ENABLE_TESTING_ENDPOINTS: 'true'
      # Весь сценарий идёт с одного адреса, обычный лимит на IP его отсечёт.
      OTP_REQUEST_LIMIT: '500'
      LOGIN_RATE_LIMIT: '500'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --all-extras --dev
      - run: uv run alembic upgrade head
      - run: uv run python -m app.cli seed-attributes

      - name: Запуск бэкенда
        run: |
          uv run uvicorn app.main:app --port 8000 --log-level warning &
          npx --yes wait-on http://127.0.0.1:8000/healthz --timeout 60000

      - name: Установка фронтенда
        working-directory: frontend
        run: npm ci

      - name: Браузер для Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Запуск SPA
        working-directory: frontend
        run: |
          npm run dev &
          npx --yes wait-on http://localhost:5173 --timeout 60000

      - name: Сквозной сценарий
        working-directory: frontend
        # В CI браузер ставит сам Playwright, поэтому системный путь не нужен.
        env:
          CHROMIUM_PATH: ''
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
