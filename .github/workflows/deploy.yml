name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Один деплой за раз: параллельные выкладки перетирали бы друг друга.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  spa:
    name: SPA → Vercel
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Выкладываем только то, что уже собралось и прошло проверки.
      - name: Проверки перед выкладкой
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Не задан секрет VERCEL_TOKEN — выкладка пропущена"
            exit 1
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  api:
    name: API → образ контейнера
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Бэкенд с SSE и подписчиком Redis не работает в serverless, поэтому
      # публикуется образ для контейнерного хостинга, а не функция Vercel.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что дальше
        run: |
          echo "Образ опубликован. Разверните его на контейнерном хостинге и"
          echo "выполните миграции: alembic upgrade head."
          echo "Отдельным процессом запустите воркер: python -m app.worker."
