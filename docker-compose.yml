services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    # Порты заняты другими проектами на этой машине, поэтому нестандартные.
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    # Локальная почта: письма с кодами видно в веб-интерфейсе, наружу ничего
    # не уходит. Без SMTP_HOST приложение просто пишет письма в лог.
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1026:1025"   # SMTP
      - "127.0.0.1:8026:8025"   # веб-интерфейс
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  todo_pgdata:
